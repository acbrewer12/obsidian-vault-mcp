
name: Graphify

# Backend choice (repo Settings -> Secrets and variables -> Actions -> Variables):
#   GRAPHIFY_BACKEND = openai   (default) OpenRouter, works for ages 13+ with parent permission
#   GRAPHIFY_BACKEND = gemini   Google Gemini API. Google requires the person who
#                               owns/uses the key to be 18 or older. Only pick this
#                               if that's true. Free-tier Gemini inputs can be used
#                               by Google to improve its products.

on:
  schedule:
    - cron: "0 9 * * *"   # daily, 9am UTC
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"  # don't re-run on its own output
  workflow_dispatch:

permissions:
  contents: write           # lets the job commit the graph back

concurrency:
  group: graphify
  cancel-in-progress: true

env:
  BACKEND: ${{ vars.GRAPHIFY_BACKEND || 'openai' }}

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The openai extra is required for the OpenRouter path: bare "graphifyy"
      # lacks the openai package that --backend openai needs.
      - name: Install Graphify
        run: |
          if [ "$BACKEND" = "gemini" ]; then
            pip install "graphifyy[gemini]"
          else
            pip install "graphifyy[openai]"
          fi

      - name: Build graph (Gemini, 18+ only)
        if: env.BACKEND == 'gemini'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional override; default is Graphify's built-in Gemini model.
          # GRAPHIFY_GEMINI_MODEL: gemini-2.5-flash
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY secret is missing"; exit 1; }
          graphify . --backend gemini --obsidian
          graphify cluster-only .

      - name: Build graph (OpenRouter)
        if: env.BACKEND != 'gemini'
        env:
          # OpenRouter is OpenAI-compatible. Change GRAPHIFY_MODEL if the free
          # model gets pulled (they rotate often).
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          GRAPHIFY_MODEL: openai/gpt-oss-20b:free
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENROUTER_API_KEY secret is missing"; exit 1; }
          graphify . --backend openai --obsidian
          # Second step builds GRAPH_REPORT.md; skipping it gives a "green"
          # run with no report.
          graphify cluster-only .

      - name: Commit graph back
        run: |
          git config user.name "graphify-bot"
          git config user.email "graphify-bot@users.noreply.github.com"
          git add graphify-out
          git diff --cached --quiet || git commit -m "Update knowledge graph"
          git push
